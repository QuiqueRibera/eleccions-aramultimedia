<script>
window.addEventListener('message', function (e) {
  if (!e.data || e.data.tipus !== 'am-iframe-altura') return;
  document.querySelectorAll('iframe').forEach(function (f) {
    if (f.contentWindow === e.source) f.setAttribute('height', e.data.altura);
  });
});
/* Si este bloc es mostra dins d'un iframe, comunica la seua altura a la pagina exterior */
if (window.self !== window.top) {
  document.documentElement.style.overflow = 'hidden';
  var amAltura = function () {
    parent.postMessage({ tipus: 'am-iframe-altura', altura: Math.ceil(document.documentElement.getBoundingClientRect().height) + 20 }, '*');
  };
  window.addEventListener('load', amAltura);
  if ('ResizeObserver' in window) new ResizeObserver(amAltura).observe(document.documentElement);
  setInterval(amAltura, 1500);
}
